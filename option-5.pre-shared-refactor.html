  pink:[[708,130,129,158,0],[820,203,129,158,0],[864,326,129,158,0],[827,452,129,158,0],[728,529,129,158,180],[596,535,129,158,180],[596,515,129,158,180],[596,485,129,158,180],[581,434,129,158,180],[600,371,186,208,180],[600,371,186,208,180],[597,202,321,360,180]],

  darkblue:[[489,463,129,158,180],[446,342,129,158,180],[481,219,129,158,180],[578,137,129,158,0],[708,130,129,158,0],[820,203,129,158,0],[800,203,129,158,0],[770,203,129,158,0],[774,276,129,158,0],[717,282,186,208,0],[717,282,186,208,0],[610,248,321,360,0]],
  purple:[[446,342,129,158,180],[481,219,129,158,180],[578,137,129,158,0],[708,130,129,158,0],[820,203,129,158,0],[864,326,129,158,0],[844,326,129,158,0],[814,326,129,158,0],[786,355,129,158,0],[717,325,186,208,0],[717,325,186,208,0],[610,248,321,360,0]],
  lightpink:[[481,219,129,158,180],[578,137,129,158,0],[708,130,129,158,0],[820,203,129,158,0],[864,326,129,158,0],[827,452,129,158,0],[807,452,129,158,0],[777,452,129,158,0],[734,434,129,158,0],[682,371,186,208,0],[682,371,186,208,0],[597,248,321,360,0]],

function runHeroChoreography(){
  const tiles=[...document.querySelectorAll('.hero-tile')];
  const names=['orange','blue','pink','yellow','green','aqua','darkblue','purple','lightpink','white'];
  const duration=6000,samples=72,cx=720,cy=404.5;
  const clamp=n=>Math.max(0,Math.min(1,n));
  const smooth=n=>{n=clamp(n);return n*n*n*(n*(n*6-15)+10)};
  const mix=(a,b,t)=>a+(b-a)*t;
  const catmull=(a,b,c,d,t)=>.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t);
  const orbitPoint=(points,progress,index)=>{
    const anchors=points.slice(0,6).map((p,i)=>{
      const pull=.84;
      const x=cx+((p[0]+64.5)-cx)*pull-64.5;
      const y=cy+((p[1]+79)-cy)*pull-79;
      return [x+(index%2?5:-4),y+((index%3)-1)*4];
    });
    const u=(progress*1.08*anchors.length)%anchors.length,i=Math.floor(u),t=u-i,n=anchors.length;
    const p0=anchors[(i-1+n)%n],p1=anchors[i%n],p2=anchors[(i+1)%n],p3=anchors[(i+2)%n];
    return [catmull(p0[0],p1[0],p2[0],p3[0],t),catmull(p0[1],p1[1],p2[1],p3[1],t)];
  };
  const introAnimations=tiles.map((tile,index)=>{
    const name=names[index],points=figmaTracks[name],z=index===0?30:index+1;
    const frames=Array.from({length:samples+1},(_,step)=>{
      const t=step/samples,orbit=orbitPoint(points,t,index);
      const stagger=index===0?0:(index%5)*.007;
      const recede=index===0?0:smooth((t-(.65+stagger))/(.27-stagger));
      let w=129,h=158,x=orbit[0],y=orbit[1];
      if(index===0){
        const focus=smooth((t-.64)/.36);
        w=mix(129,1440,focus);h=mix(158,808,focus);x=mix(orbit[0],0,focus);y=mix(orbit[1],.5,focus);
      }else{
        const smaller=mix(1,.78,recede),baseW=w,baseH=h;
        w=baseW*smaller;h=baseH*smaller;x+=(baseW-w)/2;y+=(baseH-h)/2;
      }
      return{offset:t,left:`${x/14.4}%`,top:`${y/8.09}%`,width:`${w/14.4}%`,height:`${h/8.09}%`,transform:'none',zIndex:String(z),opacity:index===0?1:mix(1,0,recede)};
    });
    return tile.animate(frames,{duration,iterations:1,fill:'forwards'});
  });

  const uniqueProjects=[
    {src:'assets/hero-project-focus.png',title:'AF Landscape',description:'An interactive 3D environment for exploring projects spatially.'},
    {src:'assets/hero-project-02.png',title:'Global operations',description:'A connected view of teams, systems and global activity.'},
    {src:'assets/hero-project-03.png',title:'Operations concept',description:'Early visual thinking for an integrated operational experience.'},
    {src:'assets/hero-project-04.png',title:'Launch lab',description:'A collaborative environment for developing and testing ideas.'},
    {src:'assets/hero-project-05.png',title:'Project workshop',description:'A closer view of the people and tools behind delivery.'}
  ];
  let featured=0,isAdvancing=false;
  const advanceFeatured=async()=>{
    if(isAdvancing)return;
    isAdvancing=true;
    const hero=document.querySelector('.gallery-hero'),info=document.querySelector('.hero-project-info');
    featured=(featured+1)%uniqueProjects.length;
    const lead=tiles[0],image=lead.querySelector('img');
    await lead.animate([{opacity:1},{opacity:0}],{duration:420,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).finished;
    const current=uniqueProjects[featured];
    if(info){info.querySelector('h2').textContent=current.title;info.querySelector('p').textContent=current.description}
    image.src=current.src;
    await image.decode().catch(()=>{});
    await lead.animate([{opacity:0},{opacity:1}],{duration:650,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'}).finished;
    isAdvancing=false;
  };
  Promise.all(introAnimations.map(animation=>animation.finished.catch(()=>{}))).then(()=>{
    const hero=document.querySelector('.gallery-hero');
    hero?.classList.add('is-carousel');
    requestAnimationFrame(()=>requestAnimationFrame(()=>hero?.classList.add('is-focused')));
    window.setInterval(advanceFeatured,5000);
  });
}
runHeroChoreography();
const list=document.querySelector('#list');
const rowMarkup=p=>`<article class="list-row" data-id="${p.id}" data-title="${p.title.toLowerCase()}" aria-expanded="false"><div class="list-info">${info(p)}</div>${art(p)}</article>`;
list.innerHTML=projects.map(rowMarkup).join('');
const landscape=list.querySelector('[data-id="landscape"]');
const motionEase='cubic-bezier(.22,1,.36,1)';
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
let projectState='collapsed',projectMotionToken=0,projectAnimations=[];
const expandedLandscapeMarkup=()=>`<div class="expanded-track"><div class="list-info expanded-context">${info(projects[1])}<button class="view-btn" type="button">View</button></div>${art(projects[1])}<dl class="meta expanded-meta"><div><dt>Work category</dt><dd>Project</dd></div><div><dt>Project type</dt><dd>POC</dd></div><div><dt>Business area</dt><dd>DS&amp;I</dd></div><div><dt>DS&amp;I scorecard</dt><dd>Yes</dd></div></dl>${overview()}${landscapeContinuation()}</div>`;
const collapsedLandscapeMarkup=()=>`<div class="list-info">${info(projects[1])}</div>${art(projects[1])}`;
function stopProjectMotion(){projectAnimations.forEach(animation=>animation.cancel());projectAnimations=[];landscape.querySelector('.collapse-preview')?.remove();landscape.querySelector('.collapse-surface')?.remove()}
function trackAnimation(element,keyframes,options){const animation=element.animate(keyframes,{...options,easing:motionEase,fill:'both'});projectAnimations.push(animation);return animation}
async function expandLandscape(){
  if(projectState==='expanded'||projectState==='expanding')return;
  const token=++projectMotionToken;stopProjectMotion();projectState='expanding';
  const startHeight=landscape.getBoundingClientRect().height;
  const oldArt=landscape.querySelector('.project-art')?.getBoundingClientRect();
  landscape.className='list-row is-selected is-expanded is-project-motion';
  landscape.setAttribute('aria-expanded','true');
  landscape.innerHTML=expandedLandscapeMarkup();
  landscape.style.height=startHeight+'px';landscape.style.overflow='hidden';
  const track=landscape.querySelector('.expanded-track'),panel=landscape.querySelector('.expanded-context'),newArt=landscape.querySelector('.project-art');
  const reveal=[...landscape.querySelectorAll('.expanded-meta,.overview,.strip-section,.process-cards')];
  const targetHeight=Math.max(500,track.scrollHeight);
  if(reducedMotion.matches){landscape.style.height='auto';landscape.style.overflow='';projectState='expanded';scheduleScrollHint();return}
  const newArtRect=newArt.getBoundingClientRect();
  const dx=(oldArt?.left??newArtRect.left)-newArtRect.left,dy=(oldArt?.top??newArtRect.top)-newArtRect.top;
  const sx=(oldArt?.width??newArtRect.width)/newArtRect.width,sy=(oldArt?.height??newArtRect.height)/newArtRect.height;
  panel.style.opacity='0';panel.style.transform='translateY(12px)';
  reveal.forEach(element=>{element.style.opacity='0';element.style.transform='translateY(12px)'});
  const heightMotion=trackAnimation(landscape,[{height:startHeight+'px'},{height:targetHeight+'px'}],{duration:600});
  trackAnimation(newArt,[{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`},{transform:'translate(0,0) scale(1)'}],{duration:500});
  trackAnimation(panel,[{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)'}],{duration:300,delay:110});
  reveal.forEach((element,index)=>trackAnimation(element,[{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)'}],{duration:300,delay:170+Math.min(index,3)*20}));
  await heightMotion.finished.catch(()=>{});
  if(token!==projectMotionToken)return;
  landscape.style.height='auto';landscape.style.overflow='';
  [panel,...reveal,newArt].forEach(element=>{element.style.opacity='';element.style.transform=''});
  landscape.classList.remove('is-project-motion');projectState='expanded';scheduleScrollHint();
  sessionStorage.setItem('af-main-scroll',String(window.scrollY));
}
async function collapseLandscape(){
  if(projectState==='collapsed'||projectState==='collapsing')return;
  const token=++projectMotionToken;stopProjectMotion();projectState='collapsing';clearTimeout(hintTimer);
  const startHeight=landscape.getBoundingClientRect().height;
  const panel=landscape.querySelector('.expanded-context'),artwork=landscape.querySelector('.project-art');
  const content=[...landscape.querySelectorAll('.expanded-meta,.overview,.strip-section,.process-cards')];
  if(reducedMotion.matches){landscape.className='list-row';landscape.setAttribute('aria-expanded','false');landscape.innerHTML=collapsedLandscapeMarkup();projectState='collapsed';return}
  landscape.classList.add('is-project-motion');landscape.style.height=startHeight+'px';landscape.style.overflow='hidden';
  const surface=document.createElement('div');surface.className='collapse-surface';landscape.append(surface);
  const preview=document.createElement('div');preview.className='collapse-preview';preview.innerHTML=collapsedLandscapeMarkup();landscape.append(preview);
  const previewInfo=preview.querySelector('.list-info'),previewArt=preview.querySelector('.project-art');
  const fromArt=artwork?.getBoundingClientRect(),toArt=previewArt?.getBoundingClientRect();
  const fading=[panel,...content].filter(Boolean);
  fading.forEach(element=>trackAnimation(element,[{opacity:getComputedStyle(element).opacity,transform:'translateY(0)'},{opacity:0,transform:'translateY(8px)'}],{duration:180}));
  if(artwork&&fromArt&&toArt){
    const dx=toArt.left-fromArt.left,dy=toArt.top-fromArt.top,sx=toArt.width/fromArt.width,sy=toArt.height/fromArt.height;
    trackAnimation(artwork,[{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`}],{duration:500});
  }
  trackAnimation(preview,[{opacity:0},{opacity:1}],{duration:240,delay:260});
  trackAnimation(surface,[{opacity:0},{opacity:1}],{duration:500});
  if(previewInfo)trackAnimation(previewInfo,[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],{duration:240,delay:260});
  const heightMotion=trackAnimation(landscape,[{height:startHeight+'px'},{height:'310px'}],{duration:500});
  await heightMotion.finished.catch(()=>{});
  if(token!==projectMotionToken)return;
  landscape.className='list-row';landscape.setAttribute('aria-expanded','false');landscape.innerHTML=collapsedLandscapeMarkup();
  landscape.style.height='';landscape.style.overflow='';landscape.scrollLeft=0;userMoved=false;projectState='collapsed';
}
list.addEventListener('click',e=>{const row=e.target.closest('[data-id]');if(row?.dataset.id==='landscape')expandLandscape()});
landscape.addEventListener('pointermove',e=>{const card=e.target.closest('.expanded-context');if(!card)return;const r=card.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5;const y=(e.clientY-r.top)/r.height-.5;card.style.setProperty('--context-tilt-x',`${(-y*3).toFixed(2)}deg`);card.style.setProperty('--context-tilt-y',`${(x*6-2).toFixed(2)}deg`)});
landscape.addEventListener('pointerleave',()=>{const card=landscape.querySelector('.expanded-context');if(!card)return;card.style.setProperty('--context-tilt-x','0deg');card.style.setProperty('--context-tilt-y','-2deg')});
let dragging=false,startX=0,startLeft=0,userMoved=false,jiggling=false,hintTimer;
function scheduleScrollHint(){
  clearTimeout(hintTimer);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  hintTimer=setTimeout(()=>{if(!userMoved&&landscape.scrollLeft<4)jiggleScroll()},1500)
}
function jiggleScroll(){
  jiggling=true;
  const start=performance.now(),duration=1200,amplitude=42;
  function frame(now){
    const progress=Math.min((now-start)/duration,1);
    landscape.scrollLeft=Math.abs(Math.sin(progress*Math.PI*2))*amplitude*(1-progress*.25);
    if(progress<1)requestAnimationFrame(frame);else{landscape.scrollLeft=0;jiggling=false}
  }
  requestAnimationFrame(frame)
}
landscape.addEventListener('pointerdown',e=>{if(!landscape.classList.contains('is-expanded'))return;userMoved=true;dragging=true;startX=e.clientX;startLeft=landscape.scrollLeft;landscape.setPointerCapture(e.pointerId)});
landscape.addEventListener('pointermove',e=>{if(dragging)landscape.scrollLeft=startLeft-(e.clientX-startX)});
landscape.addEventListener('pointerup',()=>dragging=false);
landscape.addEventListener('pointercancel',()=>dragging=false);
landscape.addEventListener('wheel',()=>userMoved=true,{passive:true});
landscape.addEventListener('touchstart',()=>userMoved=true,{passive:true});
landscape.addEventListener('scroll',()=>{if(!jiggling&&landscape.scrollLeft>4)userMoved=true},{passive:true});
document.addEventListener('click',e=>{const clickedLandscape=e.composedPath().includes(landscape);if(landscape.classList.contains('is-expanded')&&!clickedLandscape)collapseLandscape()});
bindFilters();
if('scrollRestoration' in history)history.scrollRestoration='manual';
sessionStorage.removeItem('af-main-scroll');
requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'instant'}));
if(new URLSearchParams(location.search).get('expanded')==='1')expandLandscape();
