<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AF Gallery — Option 1: Horizontal strip</title><link rel="stylesheet" href="styles.css?v=20261023-option1-restored"></head><body><div class="app option1-app" id="app"></div><script src="app.js"></script><script>
const app=document.querySelector('#app');
app.innerHTML=header()+`<main id="list"></main>`+footer();
const list=document.querySelector('#list');
const rowMarkup=p=>`<article class="list-row" data-id="${p.id}" data-title="${p.title.toLowerCase()}" aria-expanded="false"><div class="list-info">${info(p)}</div>${art(p)}</article>`;
list.innerHTML=projects.map(rowMarkup).join('');
const landscape=list.querySelector('[data-id="landscape"]');
function expandLandscape(){
  if(landscape.classList.contains('is-expanded'))return;
  const y=window.scrollY;
  const update=()=>{
    landscape.className='list-row is-selected is-expanded';
    landscape.setAttribute('aria-expanded','true');
    landscape.innerHTML=`<div class="expanded-track"><div class="list-info expanded-context">${info(projects[1])}<button class="view-btn" type="button">View</button></div>${art(projects[1])}<dl class="meta expanded-meta"><div><dt>Work category</dt><dd>Project</dd></div><div><dt>Project type</dt><dd>POC</dd></div><div><dt>Business area</dt><dd>DS&amp;I</dd></div><div><dt>DS&amp;I scorecard</dt><dd>Yes</dd></div></dl>${overview()}${landscapeContinuation()}</div>`;
  };
  if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.documentElement.classList.add('is-transitioning');
    const transition=document.startViewTransition(update);
    transition.ready.then(()=>window.scrollTo(0,y));
    transition.finished.finally(()=>{document.documentElement.classList.remove('is-transitioning');scheduleScrollHint()});
  }else{
    const startHeight=landscape.getBoundingClientRect().height;
    update();
    const endHeight=landscape.getBoundingClientRect().height;
    landscape.animate([{height:startHeight+'px',opacity:.96},{height:endHeight+'px',opacity:1}],{duration:1050,easing:'cubic-bezier(.16,1,.3,1)'});
    window.scrollTo(0,y);scheduleScrollHint()
  }
  sessionStorage.setItem('af-main-scroll',String(y));
}
let isCollapsing=false;
async function collapseLandscape(){
  if(!landscape.classList.contains('is-expanded')||isCollapsing)return;
  isCollapsing=true;
  clearTimeout(hintTimer);
  const y=window.scrollY;
  const update=()=>{
    landscape.className='list-row';
    landscape.setAttribute('aria-expanded','false');
    landscape.innerHTML=`<div class="list-info">${info(projects[1])}</div>${art(projects[1])}`;
    landscape.scrollLeft=0;
    userMoved=false;
  };
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    const expandedHeight=landscape.getBoundingClientRect().height;
    const track=landscape.querySelector('.expanded-track');
    if(track)await track.animate([
      {opacity:1,transform:'translate3d(0,0,0) scale(1)',filter:'blur(0)'},
      {opacity:0,transform:'translate3d(-10px,4px,0) scale(.996)',filter:'blur(1.5px)'}
    ],{duration:220,easing:'cubic-bezier(.4,0,.6,1)',fill:'forwards'}).finished.catch(()=>{});
    const contractAnimation=landscape.animate([
      {height:expandedHeight+'px',filter:'brightness(1)'},
      {height:'310px',filter:'brightness(.98)'}
    ],{duration:480,easing:'cubic-bezier(.76,0,.24,1)',fill:'forwards'});
    await contractAnimation.finished.catch(()=>{});
    update();
    contractAnimation.cancel();
    window.scrollTo(0,y);
    const children=[...landscape.children];
    children.forEach((child,index)=>child.animate([
      {opacity:0,transform:'translateY(8px)'},
      {opacity:1,transform:'translateY(0)'}
    ],{duration:460,delay:40+index*55,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'}));
  }else{
    update();
    window.scrollTo(0,y);
  }
  setTimeout(()=>{isCollapsing=false},580);
}
list.addEventListener('click',e=>{const row=e.target.closest('[data-id]');if(row?.dataset.id==='landscape')expandLandscape()});
landscape.addEventListener('pointermove',e=>{const card=e.target.closest('.expanded-context');if(!card)return;const r=card.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5;const y=(e.clientY-r.top)/r.height-.5;card.style.setProperty('--context-tilt-x',`${(-y*3).toFixed(2)}deg`);card.style.setProperty('--context-tilt-y',`${(x*6-2).toFixed(2)}deg`)});
landscape.addEventListener('pointerleave',()=>{const card=landscape.querySelector('.expanded-context');if(!card)return;card.style.setProperty('--context-tilt-x','0deg');card.style.setProperty('--context-tilt-y','-2deg')});
let dragging=false,startX=0,startLeft=0,userMoved=false,jiggling=false,hintTimer;
function scheduleScrollHint(){
  clearTimeout(hintTimer);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  hintTimer=setTimeout(()=>{if(!userMoved&&landscape.scrollLeft<4)jiggleScroll()},1500)
}
function jiggleScroll(){
  jiggling=true;
  const start=performance.now(),duration=1200,amplitude=42;
  function frame(now){
    const progress=Math.min((now-start)/duration,1);
    landscape.scrollLeft=Math.abs(Math.sin(progress*Math.PI*2))*amplitude*(1-progress*.25);
    if(progress<1)requestAnimationFrame(frame);else{landscape.scrollLeft=0;jiggling=false}
  }
  requestAnimationFrame(frame)
}
landscape.addEventListener('pointerdown',e=>{if(!landscape.classList.contains('is-expanded'))return;userMoved=true;dragging=true;startX=e.clientX;startLeft=landscape.scrollLeft;landscape.setPointerCapture(e.pointerId)});
landscape.addEventListener('pointermove',e=>{if(dragging)landscape.scrollLeft=startLeft-(e.clientX-startX)});
landscape.addEventListener('pointerup',()=>dragging=false);
landscape.addEventListener('pointercancel',()=>dragging=false);
landscape.addEventListener('wheel',()=>userMoved=true,{passive:true});
landscape.addEventListener('touchstart',()=>userMoved=true,{passive:true});
landscape.addEventListener('scroll',()=>{if(!jiggling&&landscape.scrollLeft>4)userMoved=true},{passive:true});
document.addEventListener('click',e=>{if(landscape.classList.contains('is-expanded')&&!e.target.closest('.list-row.is-expanded'))collapseLandscape()});
bindFilters();
if('scrollRestoration' in history)history.scrollRestoration='manual';
sessionStorage.removeItem('af-main-scroll');
requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'instant'}));
if(new URLSearchParams(location.search).get('expanded')==='1')expandLandscape();
</script></body></html>
