<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AF Gallery — Path 2</title><link rel="stylesheet" href="styles.css"></head><body><div class="app" id="app"></div><script src="app.js"></script><script>
const app=document.querySelector('#app');app.innerHTML=header(false)+`<nav class="rail" id="rail"></nav><section class="sticky-summary" id="summary"></section><main class="detail-main gradient glow"><dl class="meta"><div><dt>Start and end date</dt><dd id="date"></dd></div><div><dt>Work category</dt><dd>Project</dd></div><div><dt>Project type</dt><dd>POC</dd></div><div><dt>Business area</dt><dd>DS&amp;I</dd></div><div><dt>DS&amp;I scorecard</dt><dd>Yes</dd></div></dl><div id="focusArt"></div>${overview()}</main>`+footer();
const rail=document.querySelector('#rail');rail.innerHTML=[projects[0],projects[1],projects[2],projects[1],projects[1],projects[1]].map(p=>`<button class="rail-card ${p.type==='land'?'land':''}" data-id="${p.id}"><img src="${p.img}" alt=""><span class="status ${p.status==='Completed'?'done':''}">${p.status}</span><b>${p.title}</b></button>`).join('');function render(p){document.querySelector('#summary').innerHTML=`<div>${status(p)}<h1>${p.title}</h1></div><p>${p.desc}</p><div class="sticky-actions"><button class="close" onclick="location.href='main-opt-1.html'">Close X</button><button class="view-btn">View</button></div>`;document.querySelector('#date').textContent=p.date;document.querySelector('#focusArt').innerHTML=art(p);rail.querySelectorAll('.rail-card').forEach(c=>c.classList.toggle('active',c.dataset.id===p.id))}render(projects[1]);rail.addEventListener('click',e=>{const card=e.target.closest('[data-id]');if(card)render(byId(card.dataset.id))});
</script></body></html>
